name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  # Dependabot builds share one slot. The merge controller rescans pending PRs
  # because GitHub may replace older pending runs rather than keeping a FIFO.
  group: ${{ startsWith(github.head_ref || github.ref_name, 'dependabot/') && 'ci-dependabot' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'dependabot/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ralphschuler/agent-workbench

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Test integrations
        run: python -m unittest discover -s tests -v
      - name: Test dependency merge policy
        run: node --test .github/scripts/*.test.cjs
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Validate Compose
        run: docker compose config --quiet

  backup:
    name: Backup and restore
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test encrypted backup and isolated restore
        run: bash scripts/test-backup.sh

  container:
    name: Container build
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the desktop image for runtime checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: agent-workbench:ci
          # Refresh signed apt packages, including Chrome, each Monday.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=agent-workbench
          cache-to: type=gha,mode=max,scope=agent-workbench
      - name: Smoke-test desktop, agent CLIs, CUA and Playwright MCP
        run: bash scripts/test-container.sh agent-workbench:ci

  publish:
    name: Publish GHCR image
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main')
    needs: [validation, backup, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and OCI labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=agent-workbench
          cache-to: type=gha,mode=max,scope=agent-workbench

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validation, backup, container, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Create release with generated notes if absent
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            printf 'Release %s already exists; preserving it.\n' "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi

  required:
    name: Required checks
    if: always()
    needs: [validation, backup, container, publish, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VALIDATION: ${{ needs.validation.result }}
      BACKUP: ${{ needs.backup.result }}
      CONTAINER: ${{ needs.container.result }}
      PUBLISH: ${{ needs.publish.result }}
      RELEASE: ${{ needs.release.result }}
      EXPECT_PUBLICATION: ${{ github.event_name == 'push' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main') }}
      EXPECT_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Require successful validation, backup, and image build
        run: |
          test "$VALIDATION" = success
          test "$BACKUP" = success
          test "$CONTAINER" = success
          if [ "$EXPECT_PUBLICATION" = true ]; then
            test "$PUBLISH" = success
          fi
          if [ "$EXPECT_RELEASE" = true ]; then
            test "$RELEASE" = success
          fi
