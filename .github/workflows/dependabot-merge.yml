name: Merge Dependabot updates

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: dependabot-queue
  cancel-in-progress: false

jobs:
  merge:
    name: Advance one verified Dependabot update
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # workflow_run checks out the default branch. Never check out PR code or
      # download a CI artifact in this workflow with a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Scan the queue and advance at most one PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const merge = require('./.github/scripts/dependabot-merge.cjs');
            await merge({ github, context, core });
